version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image follows a Python version the package supports; moving it is a
      # deliberate change, so only patch and digest updates are proposed.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
