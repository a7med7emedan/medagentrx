name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run reuse lint
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
        with:
          args: -color
      - name: hadolint
        uses: docker://hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d  # v2.15.1
        with:
          args: hadolint Dockerfile

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Coverage of stats and checks
        run: uv run coverage report --include="src/medagentrx/stats/*,src/medagentrx/checks/*" --fail-under=95

  reference-proc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true
      - name: Install pROC
        run: Rscript -e 'install.packages(c("pROC", "jsonlite"))'
      - name: Recompute pROC reference values
        run: Rscript tests/reference/pROC/delong_reference.R
      - name: Reference values must not change
        run: |
          python3 - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:tests/reference/pROC/expected.json"]))
          new = json.load(open("tests/reference/pROC/expected.json"))
          for name, values in old["datasets"].items():
              for key, value in values.items():
                  assert abs(new["datasets"][name][key] - value) < 1e-10, (name, key)
          print("pROC reference values unchanged")
          PY
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest tests/reference --no-cov

  action-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run this repository's action on the example
        id: medagentrx
        uses: ./
        with:
          plan: examples/sepsis-risk/change-plan.yaml
          candidate: examples/sepsis-risk/candidate.parquet
          previous: examples/sepsis-risk/previous.parquet
          anchor: examples/sepsis-risk/anchor.parquet
          manifest: examples/sepsis-risk/train_manifest.parquet
          model-meta: examples/sepsis-risk/model.yaml
          ledger: medagentrx-ledger/ledger.jsonl
      - name: The example must be accepted
        env:
          VERDICT: ${{ steps.medagentrx.outputs.verdict }}
        run: test "$VERDICT" = ACCEPTED

  pre-commit-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked
      - name: Run the medagentrx-validate hook on the example plan
        run: uv run pre-commit try-repo . medagentrx-validate --files examples/sepsis-risk/change-plan.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag medagentrx:ci .
      - name: Run the demo read-only, without network or capabilities
        run: >-
          docker run --rm --read-only --tmpfs /tmp --network none
          --cap-drop ALL --security-opt no-new-privileges medagentrx:ci
      - name: Image size must stay under 300 MB compressed
        run: |
          size=$(docker save medagentrx:ci | gzip -c | wc -c)
          echo "compressed size: $((size / 1000000)) MB"
          test "$size" -lt 300000000
      - name: Trivy, no HIGH or CRITICAL findings
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --severity HIGH,CRITICAL --exit-code 1 --scanners vuln --no-progress medagentrx:ci
      - name: Compose file is valid
        run: docker compose config --quiet
