name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real patient data. Synthetic inputs or the demo are best.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `medagentrx version`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, a minimal plan and synthetic inputs if possible.
