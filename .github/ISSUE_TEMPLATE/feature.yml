name: Feature request
description: Suggest a new check, statistic, input format or integration.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need, and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: For statistics or checks, the method and its source.
