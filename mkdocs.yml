site_name: MedAgentRx
site_description: >-
  The prescription for self-improving medical AI. Every model update, by an engineer, a
  pipeline or an AI agent, is checked against its approved change plan (FDA PCCP, EU AI Act
  Art. 43(4)).
site_author: Ahmed Hemedan
site_url: https://a7med7emedan.github.io/medagentrx/
repo_url: https://github.com/a7med7emedan/medagentrx
repo_name: a7med7emedan/medagentrx
copyright: Copyright 2026 Ahmed Hemedan. Apache-2.0.
strict: true

theme:
  name: material
  language: en
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark theme
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Start here: index.md
  - Quickstart: quickstart.md
  - Tutorial: tutorial.md
  - For agents and AutoML: agents.md
  - Deployment QC: qc.md
  - Reference:
      - Change plan: plan-reference.md
      - Checks catalogue: checks.md
      - Command line: cli.md
      - Command-line reference: cli-reference.md
      - Python API: api.md
      - Test-set fingerprint: fingerprint.md
      - Decision ledger: ledger.md
  - Methods and validation:
      - Methods: methods.md
      - Validation results: validation.md
  - Regulatory mapping: regulatory.md
  - CI guides: ci.md
  - For reviewers: reviewers.md
  - Security:
      - Threat model: threat-model.md
  - FAQ: faq.md
  - Glossary: glossary.md
  - Roadmap: roadmap.md
