stages:
  - lint
  - test
  - reference
  - integration
  - docker
  - docs

include:
  - local: templates/medagentrx.yml
    inputs:
      stage: integration
      job-name: component-example
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
      plan: examples/sepsis-risk/change-plan.yaml
      candidate: examples/sepsis-risk/candidate.parquet
      previous: examples/sepsis-risk/previous.parquet
      anchor: examples/sepsis-risk/anchor.parquet
      manifest: examples/sepsis-risk/train_manifest.parquet
      model-meta: examples/sepsis-risk/model.yaml
      ledger: medagentrx-ledger/ledger.jsonl

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

lint:
  stage: lint
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv run reuse lint
    - uv run python scripts/validation.py --out docs/assets --figure-only
    - git diff --exit-code docs/assets

test:
  stage: test
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13"]
  image: ghcr.io/astral-sh/uv:python${PYTHON}-bookworm-slim
  script:
    - uv sync --locked
    - uv run pytest
    - uv run coverage report --include="src/medagentrx/stats/*,src/medagentrx/checks/*" --fail-under=95

reference-proc:
  stage: reference
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends r-base-core r-cran-proc r-cran-jsonlite
  script:
    - cp tests/reference/pROC/expected.json /tmp/expected.committed.json
    - Rscript tests/reference/pROC/delong_reference.R
    - uv run python -c "import json; a=json.load(open('/tmp/expected.committed.json'))['datasets']; b=json.load(open('tests/reference/pROC/expected.json'))['datasets']; assert all(abs(b[d][k]-v)<1e-10 for d in a for k,v in a[d].items()); print('pROC reference values unchanged')"
    - uv sync --locked
    - uv run pytest tests/reference --no-cov

component-example:
  before_script:
    - uv pip install --system .

pre-commit-hook:
  stage: integration
  script:
    - uv sync --locked
    - uv run pre-commit try-repo . medagentrx-validate --files examples/sepsis-risk/change-plan.yaml

docker-image:
  stage: docker
  image: docker:28.1.1@sha256:eceba5b0fc2fcf83a74c298391c2ed9e1adbdaf04ee173611bd6282ec973e7ba
  services:
    - name: docker:28.1.1-dind@sha256:eceba5b0fc2fcf83a74c298391c2ed9e1adbdaf04ee173611bd6282ec973e7ba
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker build --tag medagentrx:ci .
    - docker run --rm --read-only --tmpfs /tmp --network none --cap-drop ALL --security-opt no-new-privileges medagentrx:ci
    - test "$(docker save medagentrx:ci | gzip -c | wc -c)" -lt 300000000
    - >-
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
      aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      image --severity HIGH,CRITICAL --exit-code 1 --scanners vuln --no-progress medagentrx:ci

nightly-validation:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  timeout: 2h
  script:
    - uv sync --locked
    - uv run pytest -m slow --no-cov tests/validation
    - uv run python scripts/validation.py --out validation-results
  artifacts:
    paths:
      - validation-results/

docs:
  stage: docs
  script:
    - uv sync --locked --group docs
    - uv run python scripts/make_docs.py
    - git diff --exit-code docs
    - uv run python scripts/make_figures.py --out docs/assets
    - git diff --exit-code docs/assets
    - uv run mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public

pages:
  stage: docs
  needs: [docs]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing the documentation built by the docs job"
  artifacts:
    paths:
      - public
