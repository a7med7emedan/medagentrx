name: MedAgentRx check
description: >-
  Check every model update, by an engineer, a pipeline or an AI agent, against its approved
  change plan (FDA PCCP, EU AI Act Art. 43(4)). Fails on FAILED or OUTSIDE_PLAN.
author: Ahmed Hemedan
branding:
  icon: shield
  color: green

inputs:
  mode:
    description: >-
      check judges a model update (the default); qc judges a deployment QC run of the live
      system on the plan's control set.
    default: check
  plan:
    description: Path to change-plan.yaml.
    required: true
  candidate:
    description: Candidate predictions on the locked test set (Parquet or CSV). Mode check.
    default: ""
  previous:
    description: Predictions of the version being replaced. Mode check.
    default: ""
  anchor:
    description: Predictions of the originally authorised version. Mode check.
    default: ""
  manifest:
    description: Training data manifest of the candidate. Mode check.
    default: ""
  model-meta:
    description: model.yaml of the candidate. Mode check.
    default: ""
  scores:
    description: Live system's scores on the control set. Mode qc.
    default: ""
  expected:
    description: Expected scores of the model version on the control set. Mode qc.
    default: ""
  model-version:
    description: Version the live system reports it is running. Mode qc.
    default: ""
  control-inputs:
    description: Raw control file, checked against the plan when given. Mode qc.
    default: ""
  ledger:
    description: Decision ledger. It must persist between runs, for example committed to the repository.
    required: true
  signing-key:
    description: >-
      Ed25519 private key in PEM form for signing the ledger head, passed from a secret. Required
      when the plan sets ledger_signing_key_sha256.
    default: ""
  signing-key-passphrase:
    description: Passphrase of an encrypted signing key, passed from a secret.
    default: ""
  out:
    description: Directory for the reports, relative to the workspace.
    default: medagentrx-report
  seed:
    description: Seed for every resampling step.
    default: "0"
  replicates:
    description: Bootstrap replicates.
    default: "2000"
  format:
    description: Report formats, comma separated.
    default: html,json,md,junit
  image:
    description: >-
      MedAgentRx container image, pinned by digest. Empty builds the image from this action's
      Dockerfile.
    default: ""
  comment:
    description: Post the summary as a pull request comment ("true" or "false").
    default: "false"
  github-token:
    description: Token used to post the pull request comment.
    default: ${{ github.token }}
  artifact-name:
    description: Name of the uploaded report artifact.
    default: medagentrx-report

outputs:
  verdict:
    description: ACCEPTED, FAILED or OUTSIDE_PLAN (mode check), IN_CONTROL or OUTSIDE_PLAN (mode qc), or ERROR.
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: 0 ACCEPTED or IN_CONTROL, 1 FAILED, 2 OUTSIDE_PLAN, 3 input or usage error.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Build the MedAgentRx image
      if: inputs.image == ''
      shell: bash
      run: docker build --quiet --tag medagentrx-action:local "$GITHUB_ACTION_PATH"

    - name: Check against the plan
      id: check
      shell: bash
      env:
        MEDAGENTRX_IMAGE: ${{ inputs.image }}
        MODE: ${{ inputs.mode }}
        PLAN: ${{ inputs.plan }}
        CANDIDATE: ${{ inputs.candidate }}
        PREVIOUS: ${{ inputs.previous }}
        ANCHOR: ${{ inputs.anchor }}
        MANIFEST: ${{ inputs.manifest }}
        MODEL_META: ${{ inputs.model-meta }}
        SCORES: ${{ inputs.scores }}
        EXPECTED: ${{ inputs.expected }}
        MODEL_VERSION: ${{ inputs.model-version }}
        CONTROL_INPUTS: ${{ inputs.control-inputs }}
        LEDGER: ${{ inputs.ledger }}
        OUT: ${{ inputs.out }}
        SEED: ${{ inputs.seed }}
        REPLICATES: ${{ inputs.replicates }}
        FORMAT: ${{ inputs.format }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        MEDAGENTRX_SIGNING_KEY_PASSPHRASE: ${{ inputs.signing-key-passphrase }}
      run: |
        image="${MEDAGENTRX_IMAGE:-medagentrx-action:local}"
        signing=()
        if [ -n "$SIGNING_KEY" ]; then
          keydir="$(mktemp -d "$RUNNER_TEMP/medagentrx-key.XXXXXX")"
          chmod 700 "$keydir"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$keydir/signing.key")
          signing=(--volume "$keydir:/run/medagentrx:ro"
            --env MEDAGENTRX_SIGNING_KEY=/run/medagentrx/signing.key
            --env MEDAGENTRX_SIGNING_KEY_PASSPHRASE)
        fi
        case "${MODE:-check}" in
          check)
            command=(check "$PLAN"
              --candidate "$CANDIDATE" --previous "$PREVIOUS" --anchor "$ANCHOR"
              --manifest "$MANIFEST" --model-meta "$MODEL_META"
              --seed "$SEED" --replicates "$REPLICATES")
            passed=ACCEPTED ;;
          qc)
            command=(qc run "$PLAN"
              --scores "$SCORES" --expected "$EXPECTED" --model-version "$MODEL_VERSION")
            if [ -n "$CONTROL_INPUTS" ]; then command+=(--control-inputs "$CONTROL_INPUTS"); fi
            passed=IN_CONTROL ;;
          *)
            echo "mode must be check or qc, got '$MODE'" >&2
            exit 3 ;;
        esac
        set +e
        docker run --rm --read-only --tmpfs /tmp --network none \
          --user "$(id -u):$(id -g)" \
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
          "${signing[@]}" \
          "$image" "${command[@]}" \
          --ledger "$LEDGER" --out "$OUT" --format "$FORMAT"
        code=$?
        set -e
        if [ -n "${keydir:-}" ]; then rm -rf "$keydir"; fi
        case "$code" in
          0) verdict=$passed ;;
          1) verdict=FAILED ;;
          2) verdict=OUTSIDE_PLAN ;;
          *) verdict=ERROR ;;
        esac
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        if [ -f "$OUT/summary.md" ]; then
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "MedAgentRx: $verdict (exit code $code)" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT: ${{ inputs.out }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if [ -f "$OUT/summary.md" ]; then
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md"
        fi

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}
        if-no-files-found: warn

    - name: Fail unless the update was accepted or the live system is in control
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
